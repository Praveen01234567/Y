<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Only For Pooja 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --rose: #e8365d; --blush: #ffb3c1; --glass: rgba(255,255,255,0.18); }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0510; font-family: 'Lato', sans-serif; }

/* ── BACKGROUND ─────────────────────────────────────── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 20% 50%, #5c0d2e 0%, #1a0510 60%),
              radial-gradient(ellipse at 80% 20%, #7a1535 0%, transparent 55%);
  animation: bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse {
  from { filter: brightness(1); }
  to   { filter: brightness(1.3); }
}
#canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

/* ── SCENE ──────────────────────────────────────────── */
.scene {
  position: fixed; inset: 0; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}

/* ── CARD ───────────────────────────────────────────── */
.card {
  pointer-events: auto;
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1.5px solid rgba(255,255,255,0.28);
  border-radius: 32px;
  padding: 48px 44px 40px;
  max-width: 400px; width: 88%;
  text-align: center;
  box-shadow: 0 8px 40px rgba(200,50,80,0.25),
              0 0 0 1px rgba(255,255,255,0.07) inset,
              0 60px 100px -30px rgba(232,54,93,0.3);
  animation: cardIn 1s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(50px) scale(0.9); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
.card::before {
  content: ''; position: absolute; inset: -2px; border-radius: 34px;
  background: conic-gradient(from 0deg, var(--rose), var(--blush), var(--rose), var(--blush), var(--rose));
  z-index: -1; opacity: 0; filter: blur(6px);
  animation: ringGlow 3s 1.2s ease-in-out forwards;
}
@keyframes ringGlow {
  0%   { opacity:0; }
  50%  { opacity:0.6; }
  100% { opacity:0.25; }
}

/* ── EMOJIS ─────────────────────────────────────────── */
.emojis {
  font-size: 2.8rem; display: block; margin-bottom: 16px;
  animation: emojiFloat 2.4s ease-in-out infinite;
}
@keyframes emojiFloat {
  0%,100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-9px) scale(1.06); }
}

/* ── HEADING ────────────────────────────────────────── */
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.3rem, 4.5vw, 1.75rem);
  font-weight: 700; color: #fff; line-height: 1.5; margin-bottom: 8px;
  animation: fadeUp 0.8s 0.35s both;
}

/* ── SUBHEADING ─────────────────────────────────────── */
.sub {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.05rem, 3.5vw, 1.3rem);
  font-style: italic; color: var(--blush);
  margin-bottom: 28px; line-height: 1.5;
  animation: fadeUp 0.8s 0.55s both;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(18px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── YES BUTTON ─────────────────────────────────────── */
#yesBtn {
  display: inline-block;
  padding: 14px 48px;
  background: linear-gradient(135deg, #e8365d, #c41e45);
  color: #fff; border: none; cursor: pointer; border-radius: 50px;
  font-family: 'Lato', sans-serif; font-size: 1.05rem;
  letter-spacing: 0.06em;
  user-select: none; -webkit-user-select: none;
  position: relative; overflow: hidden; z-index: 10;
  box-shadow: 0 4px 24px rgba(232,54,93,0.55);
  animation: fadeUp 0.8s 0.75s both, yesbeat 1.6s 2.2s ease-in-out infinite;
  transition: transform 0.15s;
}
#yesBtn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent);
  border-radius: 50px;
}
#yesBtn:hover  { transform: scale(1.09); }
#yesBtn:active { transform: scale(0.95); }
@keyframes yesbeat {
  0%,100% { box-shadow: 0 4px 24px rgba(232,54,93,0.55), 0 0 0 0 rgba(232,54,93,0.35); }
  50%      { box-shadow: 0 4px 32px rgba(232,54,93,0.75), 0 0 0 14px rgba(232,54,93,0); }
}

/* ── FOOTER ─────────────────────────────────────────── */
.footer {
  margin-top: 22px; font-size: 0.7rem;
  color: rgba(255,255,255,0.32); letter-spacing: 0.07em;
  text-transform: uppercase;
  animation: fadeUp 0.8s 0.95s both;
}

/* ══════════════════════════════════════════════════════
   NO BUTTON — FIXED POSITION, ALWAYS VISIBLE ON PAGE 1
   Key fix: use inline left/top defaults + visibility
   instead of opacity-only, so GitHub Pages can't hide it
══════════════════════════════════════════════════════ */
#noBtn {
  position: fixed;
  /* Default position — JS will override once DOM is ready */
  left: 62vw;
  top: 65vh;
  z-index: 999;
  padding: 12px 26px;
  background: rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.88);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 50px;
  font-family: 'Lato', sans-serif;
  font-size: 0.95rem;
  letter-spacing: 0.04em;
  cursor: default;
  user-select: none; -webkit-user-select: none;
  /* FIXED: use visibility + opacity together.
     Start fully visible so no JS timing issues on GitHub Pages */
  opacity: 1;
  visibility: visible;
  transition: left 0.22s cubic-bezier(.22,1,.36,1),
              top  0.22s cubic-bezier(.22,1,.36,1),
              opacity 0.4s,
              visibility 0.4s;
  pointer-events: auto;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  /* Ensure button is clamped within viewport */
  max-width: calc(100vw - 48px);
}

/* Hide on page 2 using BOTH opacity AND visibility */
#noBtn.hidden-no {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* ── YES OVERLAY (PAGE 2) ────────────────────────────── */
#yesOverlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 32px;
  background: radial-gradient(ellipse at 40% 40%, #6b0f2a 0%, #1a0510 70%);
  opacity: 0; pointer-events: none;
  transition: opacity 0.7s ease;
}
#yesOverlay.show { opacity: 1; pointer-events: all; }

.big-heart {
  font-size: 5rem; display: block; margin-bottom: 22px;
  animation: heartPop 0.6s cubic-bezier(.22,1,.36,1) both,
             heartbeat2 1.4s 0.7s ease-in-out infinite;
}
@keyframes heartPop {
  from { opacity:0; transform: scale(0.2); }
  to   { opacity:1; transform: scale(1); }
}
@keyframes heartbeat2 {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.12); }
}
#yesOverlay .yay {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 8vw, 3.6rem);
  color: #fff; margin-bottom: 18px;
  animation: popIn 0.65s 0.1s cubic-bezier(.22,1,.36,1) both;
  text-shadow: 0 0 40px rgba(232,54,93,0.6);
}
#yesOverlay .msg {
  color: var(--blush);
  font-size: clamp(0.92rem, 3.2vw, 1.1rem);
  max-width: 310px; text-align: center; line-height: 1.8;
  white-space: pre-line;
  animation: popIn 0.65s 0.25s cubic-bezier(.22,1,.36,1) both;
}
#yesOverlay .hearts-row {
  font-size: 2rem; margin-top: 16px; letter-spacing: 0.2em;
  animation: popIn 0.65s 0.38s cubic-bezier(.22,1,.36,1) both;
}
.tap-hint {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  font-size: 0.65rem; color: rgba(255,255,255,0.3);
  letter-spacing: 0.1em; text-transform: uppercase;
  animation: popIn 1s 1s both; white-space: nowrap;
}
@keyframes popIn {
  from { opacity:0; transform: scale(0.6) translateY(16px); }
  to   { opacity:1; transform: scale(1)   translateY(0); }
}

/* ── MUSIC HINT ──────────────────────────────────────── */
#musicHint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 50; font-size: 0.68rem; color: rgba(255,255,255,0.4);
  letter-spacing: 0.09em; text-transform: uppercase;
  opacity: 0; animation: hintFade 5s 2s ease-in-out forwards;
  white-space: nowrap; pointer-events: none;
}
@keyframes hintFade {
  0%  { opacity:0; }
  15% { opacity:1; }
  80% { opacity:1; }
  100%{ opacity:0; }
}
</style>
</head>
<body>

<div class="bg"></div>
<canvas id="canvas"></canvas>
<div id="musicHint">🎵 tap anywhere to start music</div>

<!-- NO button — page 1 only, always visible, untouchable -->
<button id="noBtn">No 😏</button>

<div class="scene">
  <div class="card">
    <span class="emojis">🐱 ❤️</span>
    <h1>I already made my choice —<br/>it's you.</h1>
    <p class="sub">Now your turn…</p>
    <button id="yesBtn">Yes 💖</button>
    <p class="footer">Some hearts don't need convincing 🌸</p>
  </div>
</div>

<!-- YES OVERLAY (page 2) -->
<div id="yesOverlay">
  <span class="big-heart">💖</span>
  <div class="yay">She said YES! 🎉</div>
  <div class="msg" id="yesMsg"></div>
  <div class="hearts-row" id="heartsRow"></div>
  <div class="tap-hint">tap anywhere for more ✨</div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════════ */
(function(){
  const cv = document.getElementById('canvas');
  const ctx = cv.getContext('2d');
  let W, H, pts = [];
  function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  resize();
  addEventListener('resize', resize);
  const CHARS = ['❤️','💗','💕','💖','🌸','✨','💝','🩷','⭐'];
  const COLS  = ['#e8365d','#ffb3c1','#ff6b91','#ffd6e0'];
  const rnd   = (a,b) => Math.random()*(b-a)+a;
  function spawn(){
    return {
      x:rnd(0,W), y:rnd(H,H+60),
      sy:rnd(0.5,2), sx:rnd(-0.4,0.4),
      sz:rnd(10,24), rot:rnd(0,Math.PI*2), rv:rnd(-0.012,0.012),
      ph:rnd(0,Math.PI*2), al:rnd(0.5,0.9),
      ch:CHARS[0|rnd(0,CHARS.length)],
      dot:Math.random()>0.72,
      col:COLS[0|rnd(0,COLS.length)]
    };
  }
  for(let i=0;i<60;i++){ const p=spawn(); p.y=rnd(0,H); pts.push(p); }
  (function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach((p,i)=>{
      p.y-=p.sy; p.x+=p.sx+Math.sin(p.ph)*0.35;
      p.rot+=p.rv; p.ph+=0.028;
      p.al=0.65+Math.sin(p.ph)*0.28;
      if(p.y<-40){ pts[i]=spawn(); return; }
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=p.al;
      if(!p.dot){
        ctx.font=`${p.sz}px serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(p.ch,0,0);
      } else {
        ctx.beginPath(); ctx.arc(0,0,p.sz*0.16,0,Math.PI*2);
        ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=7;
        ctx.fill();
      }
      ctx.restore();
    });
    requestAnimationFrame(loop);
  })();
})();

/* ══════════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════════ */
let AC=null, musicOn=false;
function startMusic(){
  if(musicOn) return; musicOn=true;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain();
  master.gain.setValueAtTime(0,AC.currentTime);
  master.gain.linearRampToValueAtTime(0.3,AC.currentTime+2);
  master.connect(AC.destination);
  const conv=AC.createConvolver();
  const len=AC.sampleRate*2.5, imp=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){
    const d=imp.getChannelData(c);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
  }
  conv.buffer=imp;
  const dry=AC.createGain(); dry.gain.value=0.65;
  dry.connect(master); conv.connect(master);
  const notes=[[523.25,0],[659.25,0.5],[783.99,1],[659.25,1.5],
               [523.25,2],[587.33,2.5],[659.25,3],[523.25,3.5],
               [493.88,4],[587.33,4.5],[659.25,5],[783.99,5.5],
               [880,6],[783.99,6.5],[659.25,7],[523.25,7.5]];
  function melody(t0){
    notes.forEach(([f,t])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(dry);
      const at=t0+t;
      g.gain.setValueAtTime(0,at);
      g.gain.linearRampToValueAtTime(0.17,at+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,at+0.44);
      o.start(at); o.stop(at+0.5);
    });
    setTimeout(()=>melody(AC.currentTime),8600);
  }
  melody(AC.currentTime+0.1);
  function beat(){
    [0,0.25].forEach(off=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=60;
      o.connect(g); g.connect(dry);
      const t=AC.currentTime+off;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.11,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.25);
    });
    setTimeout(beat,900);
  }
  beat();
}
document.addEventListener('click',    startMusic, {once:true});
document.addEventListener('touchstart',startMusic, {once:true});

/* ══════════════════════════════════════════════════════
   NO BUTTON — page 1 only, always visible, dodges cursor
   FIX: position is set immediately via CSS (left:62vw; top:65vh)
        JS re-positions only after layout is confirmed.
        No opacity/visibility toggle on load — starts fully visible.
══════════════════════════════════════════════════════ */
const noBtn = document.getElementById('noBtn');
let nbX = 0, nbY = 0, nCount = 0, nPlaced = false;

const taunts = [
  'Nope 😏','Run run 🏃','Catch me!','Nice try 😜',
  'Not today!','Haha 😂','So close…','Impossible 😇',
  'Never!! 💨','Try harder 😝','Can\'t touch this 🕺','Bye bye 👋',
];

/* Place the No button — reads actual rendered position after layout */
function placeNoBtn(){
  // Calculate safe position
  const bw = noBtn.offsetWidth  || 96;
  const bh = noBtn.offsetHeight || 44;
  const mg = 16;

  // Default: bottom-right quadrant
  nbX = Math.min(Math.round(innerWidth * 0.62),  innerWidth  - bw - mg);
  nbY = Math.min(Math.round(innerHeight * 0.65), innerHeight - bh - mg);

  // Clamp to viewport
  nbX = Math.max(mg, nbX);
  nbY = Math.max(mg, nbY);

  noBtn.style.left = nbX + 'px';
  noBtn.style.top  = nbY + 'px';
  nPlaced = true;
}

/* Use requestAnimationFrame + setTimeout to ensure layout has painted */
function initNoBtn(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      placeNoBtn();
    });
  });
}

/* Try immediately, and also after fonts/images load (for GitHub Pages) */
if(document.readyState === 'complete'){
  initNoBtn();
} else {
  window.addEventListener('load', initNoBtn);
  // Fallback: also try after a short delay in case load fires late
  setTimeout(initNoBtn, 300);
}

function dodge(cx, cy){
  if(!nPlaced) return;
  const bw = noBtn.offsetWidth  || 96;
  const bh = noBtn.offsetHeight || 44;
  const bcx = nbX + bw/2, bcy = nbY + bh/2;
  const dx = bcx - cx, dy = bcy - cy;
  const d  = Math.sqrt(dx*dx + dy*dy) || 1;
  const push = Math.max(180, 360 - d);
  const mg = 12;
  let nx = nbX + (dx/d)*push;
  let ny = nbY + (dy/d)*push;
  nx = Math.max(mg, Math.min(innerWidth  - bw - mg, nx));
  ny = Math.max(mg, Math.min(innerHeight - bh - mg, ny));
  nbX = nx; nbY = ny;
  noBtn.style.left = nx + 'px';
  noBtn.style.top  = ny + 'px';
  nCount++;
  noBtn.textContent = taunts[(nCount - 1) % taunts.length];
  clearTimeout(noBtn._t);
  noBtn._t = setTimeout(()=>{ noBtn.textContent = 'No 😏'; }, 1000);
}

document.addEventListener('mousemove', e=>{
  if(!nPlaced) return;
  const r = noBtn.getBoundingClientRect();
  if(Math.hypot(e.clientX - r.left - r.width/2,
                e.clientY - r.top  - r.height/2) < 130)
    dodge(e.clientX, e.clientY);
});

document.addEventListener('touchmove', e=>{
  if(!nPlaced) return;
  const t = e.touches[0], r = noBtn.getBoundingClientRect();
  if(Math.hypot(t.clientX - r.left - r.width/2,
                t.clientY - r.top  - r.height/2) < 150)
    dodge(t.clientX, t.clientY);
}, {passive:true});

noBtn.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t = e.touches[0];
  dodge(t.clientX, t.clientY);
}, {passive:false});

noBtn.addEventListener('click', e=>{
  e.stopPropagation();
  dodge(e.clientX, e.clientY);
});

/* ══════════════════════════════════════════════════════
   YES BUTTON
══════════════════════════════════════════════════════ */
const yesQuotes = [
  { msg:"You just made my heart the happiest it has ever been, Pooja.\nI promise to love you every single day, in every little way.", hearts:"💖💗💕" },
  { msg:"From this moment, every sunrise is yours.\nEvery song I hear has your name written in it. 🌸", hearts:"🌸✨💝" },
  { msg:"Somewhere between all our laughs, long talks\nand silly fights — I fell in love with you. 😘", hearts:"💗💫❤️" },
  { msg:"You are not just my Valentine.\nYou are the reason I believe in love stories. 🥰", hearts:"💕🌹✨" },
  { msg:"I choose you. Today, tomorrow, and every day after.\nThank you for saying yes, Pooja. 🎀", hearts:"💖💝🌸" },
  { msg:"With you, even ordinary moments feel like magic.\nYou are my favourite person, always. ✨", hearts:"🌟💖🩷" },
];
let qIdx = 0;

document.getElementById('yesBtn').addEventListener('click', ()=>{
  startMusic();
  // Hide No button on page 2
  noBtn.classList.add('hidden-no');
  showYes();
  confetti();
});

function showYes(){
  const q = yesQuotes[qIdx % yesQuotes.length]; qIdx++;
  document.getElementById('yesMsg').innerText   = q.msg;
  document.getElementById('heartsRow').innerText = q.hearts;
  document.getElementById('yesOverlay').classList.add('show');
}

document.getElementById('yesOverlay').addEventListener('click', ()=>{
  const ov = document.getElementById('yesOverlay');
  ov.style.transition = 'opacity 0.28s';
  ov.style.opacity    = '0';
  setTimeout(()=>{
    showYes(); confetti();
    ov.style.opacity = '';
  }, 300);
});

/* ══════════════════════════════════════════════════════
   CONFETTI
══════════════════════════════════════════════════════ */
function confetti(){
  const cv  = document.getElementById('canvas');
  const ctx = cv.getContext('2d');
  const items = [];
  for(let i=0;i<65;i++){
    items.push({
      x:  innerWidth/2  + (Math.random()-0.5)*150,
      y:  innerHeight/2 + (Math.random()-0.5)*150,
      vx: (Math.random()-0.5)*20,
      vy: (Math.random()-0.5)*20 - 8,
      a:  1,
      sz: Math.random()*34+14,
      ch: ['💖','💗','💕','✨','🌸','💝','🩷','🌹','😘','🎉'][0|Math.random()*10],
    });
  }
  let f=0;
  (function fr(){
    if(f++>120) return;
    items.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.a-=0.008;
      if(p.a<=0) return;
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.font = `${p.sz}px serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.ch, p.x, p.y);
      ctx.restore();
    });
    requestAnimationFrame(fr);
  })();
  if(AC){
    [523.25,659.25,783.99,1046.5,1318.5].forEach((freq,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine'; o.frequency.value=freq;
      o.connect(g); g.connect(AC.destination);
      const t=AC.currentTime+i*0.12;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.25,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+1);
      o.start(t); o.stop(t+1.05);
    });
  }
}
</script>
</body>
</html>
